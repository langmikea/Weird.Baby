/* ============================================================
   HYBRID CATALOG GENERATOR (v21, carried forward unchanged into v23)
   Seeds with the 14 curated artifacts (hand-authored renders).
   Generates 186 more to reach 200, with correlated tag fields:
     - album → year (near album.year) → era
     - format → media → venue (loose)
     - media → render type
   Independent-ish: people, odds, provenance, type, song.
   Deterministic via seeded RNG so counts are stable across reloads.
   ============================================================ */
function buildCatalog() {
  /* Mulberry32 seeded RNG. Stable output across sessions. */
  let seed = 20260423;
  const rng = () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  const pickN = (arr, n) => {
    const copy = [...arr];
    const out = [];
    for (let i = 0; i < n && copy.length; i++) {
      const idx = Math.floor(rng() * copy.length);
      out.push(copy.splice(idx, 1)[0]);
    }
    return out;
  };
  const chance = (p) => rng() < p;

  /* media-from-format correlation */
  const MEDIA_BY_FORMAT = {
    live:       ["video", "photo", "audio"],
    studio:     ["audio", "text", "photo", "mixed"],
    acoustic:   ["video", "audio", "photo"],
    demo:       ["audio", "text"],
    rehearsal:  ["audio", "video", "photo"],
  };
  /* venue correlation */
  const VENUES_LIVE = ["paradise", "the-bowery", "red-rocks", "newport"];
  const VENUES_STUDIO = ["home-studio", "unknown"];
  const VENUES_BROADCAST = ["radio-session", "tour-bus"];
  /* render dispatch from media */
  const RENDER_BY_MEDIA = { photo: "photo", video: "video", text: "press", audio: "session", mixed: "art" };
  /* span distribution: mostly sm, some md, rare lg */
  const SPAN_H_WEIGHTS = [ ["sm", 0.55], ["md", 0.35], ["lg", 0.10] ];
  const pickWeighted = (weights) => {
    const roll = rng();
    let acc = 0;
    for (const [val, w] of weights) { acc += w; if (roll < acc) return val; }
    return weights[weights.length - 1][0];
  };

  /* curated titles pools per media type, to avoid generic "Artifact #123" */
  const TITLES_LIVE   = ["Live at", "On Stage —", "Encore —", "Sound check —", "From the Soundboard —"];
  const TITLES_STUDIO = ["Demo take", "Rough cut", "Studio outtake", "Alternate take", "Early mix"];
  const TITLES_PHOTO  = ["Backstage", "Before the set", "Between sets", "Tour moment", "Soundcheck"];
  const TITLES_PRESS  = ["Album notes", "Tour review", "Interview excerpt", "Feature", "Artist profile"];
  const TITLES_ART    = ["Portrait", "Album sketch", "Fan illustration", "Tour poster", "Setlist art"];

  const out = [...ARTIFACT_SEED];
  const START_ID = 15;
  const TARGET = 200;

  for (let i = START_ID; i <= TARGET; i++) {
    const album = pick(ALBUMS);
    /* year: centered on album.year, ± up to 2 for reissues/tours/retrospectives,
       clamped so a 2024 album doesn't get 2026 artifacts. */
    const yearJitter = Math.floor(rng() * 5) - 2;
    const year = Math.min(2025, Math.max(2008, album.year + yearJitter));
    const era = album.era;

    const format = pick(FORMATS);
    const media = pick(MEDIA_BY_FORMAT[format] || MEDIA);

    /* venue logic */
    let venue;
    if (format === "live") venue = pick(VENUES_LIVE);
    else if (format === "studio" || format === "demo") venue = pick(VENUES_STUDIO);
    else if (chance(0.3)) venue = pick(VENUES_BROADCAST);
    else venue = pick([...VENUES_LIVE, ...VENUES_STUDIO, ...VENUES_BROADCAST]);

    /* song: usually an album-ish song, sometimes null (non-song artifacts) */
    const song = chance(0.75) ? pick(SONGS) : null;

    /* people: 1-3, biased toward josephine-reyes appearing often */
    const peopleCount = 1 + Math.floor(rng() * 3);
    const people = pickN(PEOPLE, peopleCount);
    if (!people.includes("josephine-reyes") && chance(0.6)) people.unshift("josephine-reyes");

    /* odds: sparse. 0-2 tags, 60% chance of having none at all. */
    const oddsCount = chance(0.6) ? 0 : (chance(0.7) ? 1 : 2);
    const odds = oddsCount > 0 ? pickN(ODDS, oddsCount) : [];

    /* provenance: weighted */
    const provRoll = rng();
    const provenance = provRoll < 0.45 ? "band" : provRoll < 0.75 ? "fan" : provRoll < 0.92 ? "press" : "licensed";

    /* type: loose correlation with media */
    let type;
    if (media === "text") type = pick(["review", "interview", "analysis"]);
    else if (media === "photo") type = pick(["photo", "art"]);
    else if (media === "video") type = pick(["post", "cover", "update"]);
    else if (media === "audio") type = pick(["post", "update", "cover"]);
    else type = pick(TYPES);

    /* title + render-specific fields */
    const render = RENDER_BY_MEDIA[media] || "photo";
    let title, meta = null, credit = null, source = null, pull = null, sub = null;
    const albumLabel = album.id.replace(/-/g, " ");

    if (render === "video") {
      title = `${pick(TITLES_LIVE)} ${albumLabel}`;
      meta = `${venue.replace(/-/g, " ")} · ${year}`;
    } else if (render === "photo") {
      title = `${pick(TITLES_PHOTO)} — ${albumLabel}`;
      meta = `${year} · ${venue.replace(/-/g, " ")}`;
      credit = pick(people);
    } else if (render === "press") {
      const src = provenance === "press" ? pick(["Pitchfork", "NPR", "Rolling Stone", "The Guardian", "Stereogum"]) : "fan · archive";
      source = `${src} · ${year}`;
      pull = pick([
        "a record that knows exactly how long to hold its breath.",
        "the band's most patient work — and its most daring.",
        "you can hear the room the song was made in.",
        "songs that mean more the second time through.",
        "a study in restraint that never feels withheld.",
      ]);
      sub = `on ${albumLabel}`;
      title = `${pick(TITLES_PRESS)} — ${albumLabel}`;
    } else if (render === "art") {
      title = `${pick(TITLES_ART)} — ${albumLabel}`;
      credit = pick(people);
      meta = `${year}`;
    } else if (render === "session") {
      title = `${pick(TITLES_STUDIO)} — ${albumLabel}`;
      meta = `${format} · ${year}`;
    } else {
      title = `Artifact ${i}`;
    }

    /* span: mostly small, rare large, matches v17 grid feel */
    const span_w = chance(0.75) ? 1 : 2;
    const span_h = pickWeighted(SPAN_H_WEIGHTS);

    out.push({
      id: i, render, title, meta, credit, source, pull, sub,
      era, album: album.id, year, song,
      format, media, provenance, type,
      people, venue, odds,
      span_w, span_h,
    });
  }
  return out;
}

/* ============================================================
   KALEIDOSCOPE — state, recipe, and config
   MOTHBALLED for v1 (spec §7, v0.3). Code preserved for post-launch
   revival — this file keeps the recipe, config, and default state so
   the next Kaleidoscope session can reuse the API. Not rendered in v28.
   Shuffle and Loop moved out of here in v28 (they're Presets-tab
   player-behavior controls now per spec §9); KAL_SWITCHES retired.
   ============================================================ */
const KAL_STATE_DEFAULT = {
  depth: 0.5, breadth: 0.5, jitter: 0,
};

const KAL_KNOBS = [
  { id: "depth",   label: "Depth" },
  { id: "breadth", label: "Breadth" },
  { id: "jitter",  label: "Jitter" },
];

/* Stable pseudo-random — same id + salt produces same value */
function pseudoRandom(id, salt) {
  let h = 2166136261;
  const s = `${id}|${salt}`;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 10000) / 10000;
}

/* Kaleidoscope recipe — takes already-filtered items, narrows by mooshy dimensions.
   NEUTRAL-CENTER SEMANTICS: each knob at 0.5 is "pass everything." Filtering only
   fires as the knob moves away from center. Jitter is one-sided (0 = none, 1 = max scatter). */
function runKaleidoscopeRecipe(kalState, items) {
  const SURFACE_TYPES = ["post", "photo", "review"];
  const DEEP_TYPES    = ["analysis", "interview", "art", "cover", "update"];

  /* offset: -1..+1 signed distance from center */
  const dOff = (kalState.depth   - 0.5) * 2;
  const bOff = (kalState.breadth - 0.5) * 2;

  return items.filter(item => {
    /* Depth: negative offset favors surface types (cull deep), positive favors deep (cull surface) */
    if (dOff < 0 && DEEP_TYPES.includes(item.type)) {
      /* knob below center: cull deep with strength |dOff| */
      if (pseudoRandom(item.id, "d_deep") < Math.abs(dOff) * 0.85) return false;
    } else if (dOff > 0 && SURFACE_TYPES.includes(item.type)) {
      if (pseudoRandom(item.id, "d_surf") < dOff * 0.85) return false;
    }

    /* Breadth: negative favors music-heavy (audio/video), cull others; positive is "all through" = neutral here, breadth doesn't amplify, only restricts */
    if (bOff < 0 && item.media !== "audio" && item.media !== "video") {
      if (pseudoRandom(item.id, "b_nonmusic") < Math.abs(bOff) * 0.9) return false;
    }
    /* Breadth above center is a no-op — neutral already "lets everything in." */

    return true;
  }).filter(item => {
    /* Jitter: one-sided. At 0 = no scatter, at 1 = max random drop. */
    if (kalState.jitter <= 0) return true;
    return pseudoRandom(item.id, "r") > kalState.jitter * 0.7;
  });
}

/* "Default" in the sense that determines whether the recipe runs at all.
   With neutral-center semantics, knobs at 0.5 + jitter at 0 is pass-through,
   and Shuffle/Loop are intentionally excluded from this check — flipping
   them never triggers the recipe. They're honest parked switches. */
function kalIsDefault(k) {
  return k.depth === 0.5
      && k.breadth === 0.5
      && k.jitter === 0;
}

const spanStyle = (w, h) => { const hMap = { sm: 22, md: 30, lg: 38, xl: 44 }; return { gridColumn: `span ${w}`, gridRow: `span ${hMap[h] || 30}` }; };

function itemHasTag(item, group, tag) {
  if (group === "year") return String(item.year) === tag;
  const dim = DIMENSIONS.find(d => d.key === group);
  if (dim?.kind === "multi") return Array.isArray(item[group]) && item[group].includes(tag);
  return item[group] === tag;
}

/* FILTER RULE (v22, LOCKED — see docs/FILTER_LOGIC_DECISION.md):
   within-group OR, across-group AND, empty-group-silent.

   An artifact is in the output if, for every group that has at least one
   tag ON, the artifact carries at least one of that group's ON tags.
   Groups with zero tags ON are skipped — they do not constrain and they
   do not veto.

   Stated as English: "I want early OR breakthrough, at Red Rocks, on
   audio." Groups she hasn't touched don't enter the sentence. */
function matchFilter(item, selected) {
  if (selected.__randomIds) return selected.__randomIds.has(item.id);
  for (const { key, kind } of DIMENSIONS) {
    const sel = selected[key];
    if (!sel || sel.size === 0) continue;  // empty group is silent
    let carries = false;
    if (key === "year") {
      carries = sel.has(String(item.year));
    } else if (kind === "multi") {
      carries = Array.isArray(item[key]) && item[key].some(v => sel.has(v));
    } else {
      carries = item[key] != null && sel.has(item[key]);
    }
    if (!carries) return false;  // this group constrains, artifact fails it
  }
  return true;
}

/* Count for a pill under the locked rule: how many artifacts WOULD be in
   the output if *only* this pill were lit in its own group, with all
   OTHER groups left as they currently are. Per v0.1 §3 and the decision
   record's Consequences note, the count ignores the pill's own-group
   selections — otherwise within-group OR would scramble the signal.
   Clicking pills teaches the catalog's shape because counts respond to
   cross-group context without being distorted by sibling pills. */
function countForPill(items, selected, group, tag) {
  // If __randomIds is active, pills are inert — fall back to raw membership.
  if (selected.__randomIds) return items.filter(i => itemHasTag(i, group, tag)).length;
  const probe = cloneSelected(selected);
  probe[group] = new Set([tag]);  // isolate: just this pill, not additive within group
  return items.filter(i => matchFilter(i, probe)).length;
}

/* ============================================================
   SANITY AUDIT (v23) — runs once at module load.
   Verifies the locked filter rule against the generated catalog.
   Carries v22's six tests forward unchanged. Tests are dimension-agnostic
   (no test touches `mood`), so the mood removal does not affect them.
   With the 200-item generator restored as base, tests #4 (era+venue AND)
   and #5 (odds:hat sparse) are non-trivial — the catalog has shape.
   Results are logged to console and rendered as a bottom-right strip.
   ============================================================ */
function _mkSel(groups) {
  const out = {};
  DIMENSIONS.forEach(({ key }) => { out[key] = new Set(); });
  for (const [k, vs] of Object.entries(groups)) out[k] = new Set(Array.isArray(vs) ? vs : [vs]);
  return out;
}
function _runMatch(sel) { return ARTIFACT_CARDS.filter(i => matchFilter(i, sel)).length; }

const AUDIT_RESULTS = (() => {
  const N = ARTIFACT_CARDS.length;
  const tests = [];

  // 1. All off → full catalog (empty-group-silent makes every group silent)
  const t1 = _runMatch(_mkSel({}));
  tests.push({ id: 1, name: "all off → full catalog", expected: N, actual: t1, pass: t1 === N });

  // 2. Single tag on (era: breakthrough) → artifacts carrying breakthrough
  const expected2 = ARTIFACT_CARDS.filter(i => i.era === "breakthrough").length;
  const t2 = _runMatch(_mkSel({ era: "breakthrough" }));
  tests.push({ id: 2, name: "era: breakthrough alone", expected: expected2, actual: t2, pass: t2 === expected2 && t2 > 0 });

  // 3. Two tags same group (era: early + breakthrough) → within-group OR
  const expected3 = ARTIFACT_CARDS.filter(i => i.era === "early" || i.era === "breakthrough").length;
  const t3 = _runMatch(_mkSel({ era: ["early", "breakthrough"] }));
  tests.push({ id: 3, name: "era: early OR breakthrough (within-group OR)", expected: expected3, actual: t3, pass: t3 === expected3 });

  // 4. Two tags different groups (era: breakthrough + venue: red-rocks) → across-group AND
  //    With the 200-item generator this is non-trivial and meaningfully small.
  const expected4 = ARTIFACT_CARDS.filter(i => i.era === "breakthrough" && i.venue === "red-rocks").length;
  const t4 = _runMatch(_mkSel({ era: "breakthrough", venue: "red-rocks" }));
  tests.push({ id: 4, name: "era: breakthrough AND venue: red-rocks (across-group AND)", expected: expected4, actual: t4, pass: t4 === expected4 && t4 > 0 });

  // 5. Sparse Deeper tag alone (odds: hat) → artifacts carrying hat only
  //    With the generator's odds sparsity (40% chance of any odds, then weighted), this is
  //    non-zero but small — exactly the "digging in the sand" case from the decision record.
  const expected5 = ARTIFACT_CARDS.filter(i => Array.isArray(i.odds) && i.odds.includes("hat")).length;
  const t5 = _runMatch(_mkSel({ odds: "hat" }));
  const sparsePass = t5 === expected5;  // pass = rule-correct
  tests.push({ id: 5, name: "odds: hat alone (sparse Deeper)", expected: expected5, actual: t5, pass: sparsePass, info: expected5 === 0 ? "no artifacts carry this tag — rule correct, zero expected" : null });

  // 6. Empty Deeper group + tags on elsewhere → Deeper does not veto (v20 bug impossible)
  //    Set era: breakthrough, leave ALL Deeper groups empty. Expect same as test 2.
  const t6 = _runMatch(_mkSel({ era: "breakthrough" }));
  tests.push({ id: 6, name: "empty Deeper groups do NOT veto (v20 bug gone)", expected: expected2, actual: t6, pass: t6 === expected2 && t6 > 0 });

  const allPass = tests.every(t => t.pass);
  if (typeof console !== "undefined") {
    console.group("%cv23 SANITY AUDIT" + (allPass ? " — ALL PASS" : " — FAILURES"), "font-weight:600;color:" + (allPass ? "#9ec48a" : "#d47a7a"));
    console.log("Catalog size:", N);
    tests.forEach(t => {
      const tag = t.pass ? "✓" : "✗";
      const line = `${tag} #${t.id} ${t.name}: expected=${t.expected} actual=${t.actual}` + (t.info ? "  [" + t.info + "]" : "");
      console.log(line);
    });
    console.groupEnd();
  }
  return { tests, allPass, catalogSize: N };
})();

function prettyTag(tag) { return String(tag).replace(/-/g, " "); }

function measureWidestLabel(labels) {
  if (typeof window === "undefined") return 100;
  const span = document.createElement("span");
  Object.assign(span.style, { position: "absolute", visibility: "hidden", whiteSpace: "nowrap", fontFamily: sansBody, fontSize: "11.5px", fontWeight: "500", letterSpacing: "0.02em", textTransform: "lowercase" });
  document.body.appendChild(span);
  let max = 0;
  labels.forEach(l => { span.textContent = l; const w = span.getBoundingClientRect().width; if (w > max) max = w; });
  document.body.removeChild(span);
  return Math.ceil(max);
}

function useGlobalPillWidth() {
  const [width, setWidth] = useState(120);
  useLayoutEffect(() => {
    const maxCount = ARTIFACT_CARDS.length;
    const labels = [];
    DIMENSIONS.forEach(({ values }) => values.forEach(v => labels.push(`${prettyTag(v)}   ${maxCount}`)));
    setWidth(measureWidestLabel(labels) + 20 + 8 + 6);
  }, []);
  return width;
}

function cloneSelected(sel) {
  const out = {};
  for (const k of Object.keys(sel)) {
    if (k === "__randomIds") out.__randomIds = new Set(sel.__randomIds);
    else out[k] = new Set(sel[k] ?? []);
  }
  return out;
}
function selectedIsEmpty(sel) {
  if (sel.__randomIds && sel.__randomIds.size > 0) return false;
  for (const { key } of DIMENSIONS) if (sel[key]?.size > 0) return false;
  return true;
}
function presetSummaryText(p) {
  if (!p) return "empty";
  if (p.__randomIds) return `${p.__randomIds.size} random artifacts`;
  const parts = [];
  /* v28: tag summary. Shuffle/Loop appear as trailing notes if on. */
  if (p.selected) {
    for (const { key } of DIMENSIONS) {
      if (p.selected[key]?.size) {
        parts.push(`${key}: ${[...p.selected[key]].map(prettyTag).join(", ")}`);
      }
    }
  } else {
    /* Legacy snapshot shape (pre-v28) — selection keys at top level.
       Keep the display working if an old preset is somehow in state. */
    for (const { key } of DIMENSIONS) {
      if (p[key]?.size) parts.push(`${key}: ${[...p[key]].map(prettyTag).join(", ")}`);
    }
  }
  const flags = [];
  if (p.shuffle) flags.push("shuffle");
  if (p.loop) flags.push("loop");
  const body = parts.join("  /  ") || "no tags";
  return flags.length ? `${body}  ·  ${flags.join(" + ")}` : body;
}

/* Preset snapshot shape per spec §9.4 (v28).
   Capture:
     selected       — every ON tag across every group
     shuffle, loop  — booleans
     playingTrack   — { id, positionSec, album } | null
     spinePosition  — album id | null
   APPLY semantics are deferred (§9.4) — v28 ships the data capture.
   Prototype-level APPLY in this file restores selected/shuffle/loop only;
   player/spine fields are captured but not acted on (no player or spine

function makePresetSnapshot({ selected, shuffle, loop, playingTrack, spinePosition }) {

function Knob({ id, label, value, onChange }) {
  const wrapRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const deg = value * 270 - 135;
  const readoutVal = Math.round(value * 100);

  const onMouseDown = (e) => {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY, startVal = value;
    setDragging(true);
    const onMove = (ev) => {
      const dx = (ev.clientX - startX) / 150;
      const dy = (startY - ev.clientY) / 150;
      const next = Math.max(0, Math.min(1, startVal + dx + dy));
      onChange(next);
    };
    const onUp = () => {
      setDragging(false);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  return (
    <div style={S.kalBlock}>
      <div
        ref={wrapRef}
        className={"knob-wrap" + (dragging ? " dragging" : "")}
        style={S.knobWrap}
        onMouseDown={onMouseDown}
        role="slider"
        aria-label={label}
        aria-valuenow={readoutVal}
      >
        <div style={S.knob}>
          <div style={{ ...S.knobIndicator, transform: `translateX(-50%) rotate(${deg}deg)` }} />
        </div>
        <div className="knob-readout" style={S.knobReadout}>{readoutVal}</div>
      </div>
      <div style={S.kalBlockLabel}>{label}</div>
    </div>
  );
}

function VuMeter({ percent }) {
  /* Segmented gas-gauge meter with transient pop + peak marker decay.
     Gas-gauge semantics (post-v24): full tank = all green, running low
     = yellow, empty = lone red at bottom. 12 segments bottom-to-top:
     1 red, 3 yellow, 8 green. Rendered via column-reverse so array
     index 0 = bottom. */
  const [current, setCurrent] = useState(percent);
  const [peak, setPeak] = useState(0);
  const stateRef = useRef({ current: percent, target: percent, peak: 0, peakHold: 0, lastFrame: performance.now() });

  /* Pop on target change */
  useEffect(() => {
    const st = stateRef.current;
    const jump = percent - st.target;
    if (Math.abs(jump) > 2) {
      const popMag = Math.min(Math.abs(jump) * 0.4, 8);
      st.current = Math.min(100, percent + (jump > 0 ? popMag : 0));
    } else {
      st.current = percent;
    }
    st.target = percent;
    const currentSeg = Math.round((st.current / 100) * 12);
    if (currentSeg > st.peak) { st.peak = currentSeg; st.peakHold = 800; }
    setCurrent(st.current);
    setPeak(st.peak);
  }, [percent]);

  /* RAF loop — decay pop + peak */
  useEffect(() => {
    let rafId;
    const tick = (now) => {
      const st = stateRef.current;
      const dt = now - st.lastFrame;
      st.lastFrame = now;
      let changed = false;
      if (Math.abs(st.current - st.target) > 0.1) {
        const delta = st.target - st.current;
        st.current += delta * Math.min(1, dt / 120);
        changed = true;
      }
      if (st.peakHold > 0) {
        st.peakHold -= dt;
      } else if (st.peak > 0) {
        st.peak -= dt / 400;
        if (st.peak < 0) st.peak = 0;
        changed = true;
      }
      if (changed) {
        setCurrent(st.current);
        setPeak(st.peak);
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafId);
  }, []);

  const litCount = Math.round((current / 100) * 12);
  const peakSeg = Math.floor(peak);

  const segs = [];
  for (let i = 0; i < 12; i++) {
    let bg = LED_OFF;
    let shadow = "none";
    const isLit = i < litCount;
    const isPeak = !isLit && peakSeg > litCount && i === peakSeg - 1 && peak > 0;
    if (isLit) {
      if (i < 1)       { bg = LED_RED;    shadow = "0 0 5px rgba(200, 96, 64, 0.6)"; }
      else if (i < 4)  { bg = LED_YELLOW; shadow = "0 0 4px rgba(200, 160, 80, 0.55)"; }
      else             { bg = LED_GREEN;  shadow = "0 0 4px rgba(138, 154, 74, 0.5)"; }
    } else if (isPeak) {
      bg = "#d8c890"; shadow = "0 0 4px rgba(216, 200, 144, 0.6)";
    }
    segs.push(<div key={i} style={{ ...S.vuSeg, background: bg, boxShadow: shadow }} />);
  }

  return (
    <div style={S.vuOuter}>
      <div style={S.vuColumn}>{segs}</div>
    </div>
  );
}

/* ============================================================
   DEEP TRACKS TAB CONTENT (v28)
   Per spec §5.5: Deep Tracks tab body contains, top-to-bottom:
     search input (auto-focused on first open of this tab in session)
     search-results corral (only when input has text)
     tag columns (the normal multi-column Deep Tracks layout)
   Pill behavior in the corral is identical to pill behavior in the
   columns — same toggle, same selection state.
   ============================================================ */
function DeepTracksContent({ dims, selected, toggle, pillWidth, query, setQuery, focusSignal }) {
  const inputRef = useRef(null);
  useEffect(() => { if (focusSignal) inputRef.current?.focus(); }, [focusSignal]);

  const q = query.trim().toLowerCase();
  const hits = useMemo(() => {
    if (!q) return [];
    const out = [];
    DIMENSIONS.forEach(dim => {
      dim.values.forEach(v => {
        if (prettyTag(v).toLowerCase().includes(q)) out.push({ group: dim.key, tag: v });
      });
    });
    return out;
  }, [q]);

  const hasQuery = q.length > 0;

  return (
    <ScrollFadeContainer>
      <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
        <div style={S.searchWrap}>
          <div style={S.searchInputHolder}>
            <input
              ref={inputRef}
              className="searchbar"
              type="text"
              placeholder="search for any tag across all tiers"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
          </div>
          {hasQuery && (
            <div className="pillscroll" style={S.corral}>
              {hits.length === 0 ? (
                <span style={{ fontSize: "11px", color: GOLD_MUTE, fontStyle: "italic", padding: "0 4px" }}>
                  no tags match "{query}"
                </span>
              ) : hits.map(({ group, tag }, i) => {
                const active = selected[group]?.has(tag) ?? false;
                const count = countForPill(ARTIFACT_CARDS, selected, group, tag);
                const zero = !active && count === 0;
                return <PillButton key={`${group}-${tag}-${i}`} label={tag} count={count} active={active} zero={zero} pillWidth={null} onClick={() => toggle(group, tag)} />;
              })}
            </div>
          )}
        </div>
        <div style={S.groupsRow}>
          {dims.map(dim => (
            <PillGroupColumn key={dim.key} group={dim.key} values={dim.values} items={ARTIFACT_CARDS} selected={selected} toggle={toggle} pillWidth={pillWidth} />
          ))}
        </div>
      </div>
    </ScrollFadeContainer>
  );
}

/* ============================================================
   PRESETS — v28 layout
   Spec §9.2–9.4:
     Top row: user slots (P1/P2/P3) top-left, Shuffle/Loop pill switches
     inline to the right. Factory presets below the slots row.
   Slot actions inline per slot (not a separate SAVE CURRENT bar):
     APPLY        shown when slot non-empty
     CLEAR SLOT   shown when slot non-empty
     SAVE HERE    shown when slot empty OR state differs from saved
   Snapshot captures: every ON tag, shuffle, loop, playingTrack,
   spinePosition. APPLY semantics deferred — v28 restores selected +
   shuffle + loop (player/spine not actionable in the prototype).
   ============================================================ */
function PresetsContent({ userPresets, setUserPresets, selected, setSelected,
                         shuffle, setShuffle, loop, setLoop,
                         playingTrack, spinePosition }) {
  const [lastFactoryApplied, setLastFactoryApplied] = useState(null);

  const applyFactoryPreset = (preset) => {
    const next = preset.apply();
    const cleared = {};
    DIMENSIONS.forEach(({ key }) => { cleared[key] = new Set(); });
    if (next.__randomIds) {
      setSelected({ ...cleared, __randomIds: next.__randomIds });
    } else {
      for (const [k, v] of Object.entries(next)) cleared[k] = v;
      setSelected(cleared);
    }
    setLastFactoryApplied(preset.key);
  };

  const slotIsFilled = (slot) => !!userPresets[slot];
  const saveHere = (slot) => {
    const snap = makePresetSnapshot({ selected, shuffle, loop, playingTrack, spinePosition });
    setUserPresets(prev => ({ ...prev, [slot]: snap }));
  };
  const applySlot = (slot) => {
    const p = userPresets[slot];
    if (!p) return;
    /* Legacy-shape backward compatibility: if p doesn't have p.selected,
       treat the top-level as the selection map (old save shape). */
    if (p.selected) {
      setSelected(cloneSelected(p.selected));
      setShuffle(!!p.shuffle);
      setLoop(!!p.loop);
    } else {
      setSelected(cloneSelected(p));
    }
  };
  const clearSlot = (slot) => {
    setUserPresets(prev => ({ ...prev, [slot]: null }));
  };

  return (
    <div className="wb-scroll" style={S.contentBody}>
      <div style={S.presetsSectionLabel}>presets</div>
      <div style={S.presetsTopRow}>
        <div style={S.presetsSlotsCol}>
          {["P1", "P2", "P3"].map(slot => {
            const has = slotIsFilled(slot);
            const p = userPresets[slot];
            return (
              <div key={slot} style={S.presetSlotRow(has)}>
                <span style={S.presetSlotLabel}>{slot}</span>
                <span style={S.presetSummary(!has)} title={has ? presetSummaryText(p) : undefined}>
                  {has ? presetSummaryText(p) : "empty"}
                </span>
                <button
                  className="preset-row-btn"
                  style={S.presetRowBtn(has, true)}
                  onClick={has ? () => applySlot(slot) : undefined}
                  aria-disabled={!has}
                >apply</button>
                <button
                  className="preset-row-btn"
                  style={S.presetRowBtn(has, false)}
                  onClick={has ? () => clearSlot(slot) : undefined}
                  aria-disabled={!has}
                >clear slot</button>
                <button
                  className="preset-row-btn"
                  style={S.presetRowBtn(true, true)}
                  onClick={() => saveHere(slot)}
                  title={has ? "overwrite this slot with current state" : "save current state to this slot"}
                >save here</button>
              </div>
            );
          })}
        </div>
        <div style={S.presetsPlayerCol}>
          <div style={S.presetsPlayerLabel}>player</div>
          <div style={S.presetsPill(shuffle)} onClick={() => setShuffle(s => !s)}
               role="switch" aria-checked={shuffle}>
            <span>shuffle</span>
            <span style={S.presetsPillState(shuffle)}>{shuffle ? "on" : "off"}</span>
          </div>
          <div style={S.presetsPill(loop)} onClick={() => setLoop(l => !l)}
               role="switch" aria-checked={loop}>
            <span>loop</span>
            <span style={S.presetsPillState(loop)}>{loop ? "on" : "off"}</span>
          </div>
        </div>
      </div>

      <div style={S.presetsSectionLabel}>factory</div>
      <div style={S.factoryGrid}>
        {FACTORY_PRESETS.map(p => (
          <div key={p.key} style={S.presetCard(lastFactoryApplied === p.key)} onClick={() => applyFactoryPreset(p)}>
            <span style={S.presetLabel}>{p.label}</span>
            <span style={S.presetDesc}>{p.desc}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   KALEIDOSCOPE — the mixer console
   DORMANT in v28 per spec §7 [MOTHBALLED for v1].
   Component preserved for post-launch revival. Not mounted anywhere
   in this prototype. Kept alongside Knob / PillSwitch / VuMeter so
   the revival reuses the same API without a rebuild. When the post-
   launch Kaleidoscope ships, also reinstate the `runKaleidoscopeRecipe`
   step in the filtering pipeline (currently tagFiltered === finalMatched).
   ============================================================ */
function KaleidoscopeContent({ kalState, setKalState, remainingPercent, remainingCount, totalCount }) {
  const setKnob = (id) => (v) => setKalState(prev => ({ ...prev, [id]: v }));

  return (
    <div className="wb-scroll" style={S.contentBody}>
      <div style={S.kalWrap}>
        <div style={S.kalConsole}>

          <div style={S.kalKnobRow}>
            {KAL_KNOBS.map(cfg => (
              <Knob key={cfg.id} id={cfg.id} label={cfg.label}
                    value={kalState[cfg.id]} onChange={setKnob(cfg.id)} />
            ))}
          </div>

          <div style={S.vuCluster}>
            <VuMeter percent={remainingPercent} />
            <div style={S.vuReadoutStack}>
              <div style={S.vuReadoutNumber}>{remainingCount}<span style={{ fontSize: "16px", color: GOLD_LO }}> / {totalCount}</span></div>
              <div style={S.vuReadoutLabel}>artifact<br/>remaining</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */
function Prototype() {
  const [query, setQuery] = useState("");
  /* Initial selection = entry preset (curated, never raw catalog). */
  const [selected, setSelected] = useState(() => makeEntrySelection());
  /* Kaleidoscope state preserved but dormant in v28 — knobs are not rendered,
     the recipe is not invoked, and the VU meter does not mount. Keeping
     kalState + the default shape intact so the post-launch revival reuses
     the same API. Shuffle and Loop lifted OUT of kalState in v28 per
     spec §9: they're player-behavior controls living in Presets now, not
     Kaleidoscope knobs. */
  const [kalState, setKalState] = useState(KAL_STATE_DEFAULT);
  const [shuffle, setShuffle] = useState(false);
  const [loop, setLoop] = useState(false);
  /* Player and spine state — v28 prototype does not render a player or a
     spine, but preset snapshot capture (spec §9.4) reserves these fields.
     In the real exhibit these are driven from the player / coverflow.
     Stubbed to null here so snapshot shape is stable. */
  const [playingTrack, _setPlayingTrack] = useState(null); // { id, positionSec, album } | null
  const [spinePosition, _setSpinePosition] = useState(null); // album id | null
  const [activeTab, setActiveTab] = useState(null);
  const [hoverPeek, setHoverPeek] = useState(false);
  const [dockHeight, setDockHeight] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const n = parseInt(raw, 10); if (!isNaN(n) && n >= DOCK_MIN_H) return n; }
    } catch (e) { /* ignore */ }
    return DOCK_DEFAULT_H_SHARED;
  });
  const [resizing, setResizing] = useState(false);
  const [resizeHover, setResizeHover] = useState(false);
  const [userPresets, setUserPresets] = useState({ P1: null, P2: null, P3: null });
  const [searchFocusSignal, setSearchFocusSignal] = useState(0);
  const pillWidth = useGlobalPillWidth();
  const hoverTimerRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, String(dockHeight)); } catch (e) { /* ignore */ }
  }, [dockHeight]);

  /* FILTERED PIPELINE (v28 — Kaleidoscope dormant):
     tag filters narrow the catalog. Kaleidoscope recipe is not invoked
     in v28. finalMatched == tagFiltered. When Kaleidoscope revives
     post-launch, reintroduce the recipe step here. */
  const tagFiltered = useMemo(
    () => ARTIFACT_CARDS.filter(c => matchFilter(c, selected)),
    [selected]
  );
  const finalMatched = tagFiltered;
  const remainingPercent = ARTIFACT_CARDS.length > 0
    ? (finalMatched.length / ARTIFACT_CARDS.length) * 100
    : 0;

  const toggle = (group, tag) => {
    setSelected(prev => {
      const next = {};
      for (const { key } of DIMENSIONS) next[key] = new Set(prev[key] ?? []);
      /* Transitioning away from entry preset's __randomIds state into filter-based browsing.
         Any tier toggle implicitly dismisses the random-entry state. */
      if (next[group].has(tag)) next[group].delete(tag);
      else next[group].add(tag);
      return next;
    });
  };

  /* Clear All (v28): clears everything. Tags off, shuffle/loop off,
     search cleared, Kaleidoscope state reset (dormant but kept in
     sync for clean revival). Per §6.5 "Clear All clears all." */
  const clear = () => {
    setSelected(makeEntrySelection());
    setKalState(KAL_STATE_DEFAULT);
    setShuffle(false);
    setLoop(false);
    setQuery("");
  };

  const anyTagSelected = selected.__randomIds || Object.values(selected).some(s => s instanceof Set && s.size > 0);
  /* v28: shuffle and loop count as active filter state (they're part of
     the preset snapshot per §9.4). Kaleidoscope is dormant. */
  const anySelected = anyTagSelected || shuffle || loop;

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && (activeTab || hoverPeek)) { setActiveTab(null); setHoverPeek(false); } };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [activeTab, hoverPeek]);

  useEffect(() => {
    const onResize = () => {
      const vh = window.innerHeight;
      setDockHeight(prev => Math.max(DOCK_MIN_H, Math.min(prev, vh * DOCK_MAX_FRAC)));
    };
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const scheduleHoverOpen = () => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    hoverTimerRef.current = setTimeout(() => { setHoverPeek(true); }, HOVER_DELAY_OPEN);
  };
  const scheduleHoverClose = () => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    hoverTimerRef.current = setTimeout(() => { setHoverPeek(false); }, HOVER_DELAY_CLOSE);
  };
  const cancelHoverTimer = () => {
    if (hoverTimerRef.current) { clearTimeout(hoverTimerRef.current); hoverTimerRef.current = null; }
  };

  const open = activeTab !== null && activeTab !== "close";
  let dockPx;
  if (open) dockPx = dockHeight;
  else if (hoverPeek) dockPx = TAB_STRIP_H;
  else dockPx = TAB_PEEK;

  const handleTabClick = (tabKey) => {
    if (tabKey === "close") { setActiveTab(null); setHoverPeek(false); return; }
    if (activeTab === tabKey) { setActiveTab(null); setHoverPeek(false); return; }
    setActiveTab(tabKey);
    setHoverPeek(false);
    /* Search input lives inside Deep Tracks (spec §5.5 v28).
       Autofocus fires when Deep Tracks tab opens. */
    if (tabKey === "deep") setSearchFocusSignal(s => s + 1);
  };

  const startResize = useCallback((e) => {
    e.preventDefault(); e.stopPropagation();
    setResizing(true);
    const startY = e.clientY, startH = dockHeight, vh = window.innerHeight;
    const onMove = (me) => {
      const dy = me.clientY - startY;
      let next = startH - dy;
      next = Math.max(DOCK_MIN_H, Math.min(next, vh * DOCK_MAX_FRAC));
      setDockHeight(next);
    };
    const onUp = () => {
      setResizing(false);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }, [dockHeight]);

  const animClass = "animated" + (resizing ? " resizing" : (!open && hoverPeek ? " quick" : ""));

  const panelClickHandler = () => {
    if (open || hoverPeek) {
      setActiveTab(null); setHoverPeek(false); cancelHoverTimer();
    }
  };

  const currentTab = activeTab && activeTab !== "close" ? TABS.find(t => t.key === activeTab) : null;

  return (
    <div style={S.app}>
      <style>{S.gFonts}</style>

      <div className={animClass} style={S.panelPos(dockPx)} onClick={panelClickHandler}>
        <div className="wb-scroll" style={S.panelScroll}>
          <P3Panel matched={finalMatched} totalCount={ARTIFACT_CARDS.length} />
        </div>
      </div>

      <div className={animClass} style={S.dock(dockPx)} onClick={(e) => e.stopPropagation()}>

        <div style={S.tabStrip}
             onMouseEnter={() => { if (!open) { cancelHoverTimer(); scheduleHoverOpen(); } }}
             onMouseLeave={() => { if (!open) scheduleHoverClose(); }}>
          {TABS.map(t => {
            const isActive = activeTab === t.key;
            /* Tab signaling note (post-v24, v28):
               Tier tabs have no per-tab signal — Clear All in the tab strip
               is the global "something is active" cue. Kaleidoscope was
               retired from the dock in v28 so its activity dot is gone. */
            const isClose = t.kind === "close";
            return (
              <div key={t.key}
                   className={isActive ? "" : "tab-hoverable"}
                   style={S.tab(isActive, open, t.width, isClose)}
                   onClick={(e) => { e.stopPropagation(); handleTabClick(t.key); }}
                   role="button"
                   title={t.label}>
                <span>{t.label}</span>
              </div>
            );
          })}

          {anySelected && (open || hoverPeek) && (
            <button
              style={S.stripClearBtn}
              onClick={(e) => { e.stopPropagation(); clear(); }}
              title="clear all tags, shuffle, and loop"
            >clear all</button>
          )}
        </div>

        {open && currentTab && (
          <div style={S.dockBody}>
            <div style={S.resizeHandle(resizeHover || resizing)}
                 onMouseDown={startResize}
                 onMouseEnter={() => setResizeHover(true)}
                 onMouseLeave={() => setResizeHover(false)} />

            {currentTab.kind === "tier" && (() => {
              const dims = DIMENSIONS.filter(d => d.tier === currentTab.tier);
              /* Deep Tracks tab (tier 3) carries the search surface atop
                 the tag columns per spec §5.5 v28. Other tier tabs render
                 columns only. */
              if (currentTab.key === "deep") {
                return <DeepTracksContent
                         dims={dims} selected={selected} toggle={toggle}
                         pillWidth={pillWidth}
                         query={query} setQuery={setQuery}
                         focusSignal={searchFocusSignal} />;
              }
              return <TierContent tab={currentTab} dims={dims} selected={selected}
                                  toggle={toggle} pillWidth={pillWidth} />;
            })()}

            {currentTab.kind === "special" && currentTab.special === "presets" && (
              <PresetsContent userPresets={userPresets} setUserPresets={setUserPresets}
                              selected={selected} setSelected={setSelected}
                              shuffle={shuffle} setShuffle={setShuffle}
                              loop={loop} setLoop={setLoop}
                              playingTrack={playingTrack} spinePosition={spinePosition} />
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<><Prototype /><AuditStrip /></>);
</script>

</body>
