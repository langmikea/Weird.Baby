<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weird.Baby</title>

    <!-- [R4 2026-08-02] EVERY FONT THE MUSEUM USES, REQUESTED ONCE, HERE.
         B7/R4 found six Google-font @imports across five stylesheets - six
         render-blocking requests and six lists that had already drifted from
         each other (Syne was asked for at 400;600;800 in three rooms and
         400;600;700;800 in two, so a 700 weight rendered synthetic-bold on
         whichever route loaded the shorter list first).
         The union first went into museum-tokens.css, which is the file the
         type tokens live in and looked like the right home. It is not: that
         file is imported by three stylesheets, so the built CSS carried three
         identical @import lines. Browsers dedupe the fetch, but three
         declarations of one fact is the shape this round is here to remove.
         A <link> in the head is ALSO the faster mechanism, and by a real
         margin: an @import is only discovered after the CSS that contains it
         has been fetched and parsed, while a <link> is found by the preload
         scanner in the first pass over the markup. Preconnect on both Google
         hosts because the stylesheet and the font files are on different
         origins.
         Alphabetical family order is required by the css2 API. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;1,400&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&amp;family=Fredoka:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Syne:wght@400;600;700;800&amp;display=swap" />
    <!-- [R1 2026-08-02] BROKEN, mechanical cure applied. This said "Currently
         exhibiting Hunter Root" - a wing that is now REFERENCE-HELD and
         unlisted. It is the description every share, preview and search
         result shows, so the site was advertising the one exhibit it does
         not list. Named the two wings that are actually on. -->
    <meta name="description" content="Weird.Baby Museum. Exhibiting the MGK robots and Worth A Listen." />

    <!-- [C4 2026-08-02] SHARE TAGS - the handshake before the email.
         An artist who is sent a link sees THIS before they see the site, and
         until now a shared link showed whatever the platform chose to guess.
         HONEST, NOT SALESY: the description says what the place is and what
         it takes (nothing), because the first thing an artist should learn is
         the business model - the same doctrine the money FAQ follows.
         PER-ROUTE TITLES ARE NOT HERE, and that is stated rather than hidden:
         this is a single-page app served from one shell, so a static tag
         cannot vary by route. Doing it properly needs per-route rendering at
         the edge. What ships is one honest site-level card instead of twelve
         wrong ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weird.Baby" />
    <meta property="og:title" content="Weird.Baby Museum" />
    <meta property="og:description" content="A museum of weird things worth keeping. The MGK robots, and music worth a listen. No ads, no affiliate links, no cut of anything you buy from an artist." />
    <meta property="og:image" content="/share-card.png" />
    <meta property="og:image:alt" content="Weird.Baby" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weird.Baby Museum" />
    <meta name="twitter:description" content="A museum of weird things worth keeping. No ads, no affiliate links, no cut of anything you buy from an artist." />
    <meta name="twitter:image" content="/share-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
